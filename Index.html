<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href="manifest.json">

    <title>Speed Sage HUD v4.0 (Map Edition)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#000000',
                        primary: '#06b6d4', // Cyan-500
                        alert: '#ef4444',   // Red-500
                        muted: '#94a3b8',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        display: ['Orbitron', 'sans-serif'],
                    },
                    animation: {
                        'grid-flow': 'gridMove 20s linear infinite',
                        'flash': 'flashAlert 1s infinite',
                    },
                    keyframes: {
                        flashAlert: {
                            '0%, 100%': { boxShadow: 'inset 0 0 0 0 transparent' },
                            '50%': { boxShadow: 'inset 0 0 50px #ef4444' },
                        }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Share+Tech+Mono&family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <style>
        /* 3D Perspective Classes */
        .hud-perspective {
            perspective: 500px;
            transform-style: preserve-3d;
        }

        .hud-grid-3d {
            transform: rotateX(60deg) scale(2) translateY(-20%);
            transform-origin: center top;
        }

        /* MIRROR MODE */
        .mirror-mode {
            transform: scaleY(-1);
        }

        /* Animated Grid Background - Now blended with Map */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.1) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            mix-blend-mode: screen; /* Blends coolly with the map */
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }
        
        .animate-grid {
            animation: gridMove 2s linear infinite;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
        }

        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px;
            border-radius: 50%; background: #06b6d4; margin-top: -8px;
            box-shadow: 0 0 10px #06b6d4;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px;
        }

        body::-webkit-scrollbar { display: none; }
        .alert-mode { animation: flashAlert 1s infinite; }

        /* Map Specifics */
        #map-bg {
            filter: grayscale(100%) invert(100%) contrast(1.2) brightness(0.6); /* Cyberpunk Filter */
            z-index: 0;
            pointer-events: none; /* Let clicks pass through to HUD */
        }
        
        /* Custom Arrow Marker */
        .arrow-icon {
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #06b6d4;
            filter: drop-shadow(0 0 5px #06b6d4);
        }
    </style>
</head>
<body id="app-body" class="min-h-screen bg-black text-white overflow-hidden relative font-sans select-none transition-colors duration-300">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <div id="settings-modal" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl hidden flex-col items-center justify-center p-6">
        <div class="w-full max-w-md space-y-8">
            <h2 class="text-3xl font-display text-primary uppercase tracking-widest text-center border-b border-primary/30 pb-4">System Config</h2>
            <div class="space-y-6">
                <div class="glass-panel p-4 rounded-lg flex justify-between items-center">
                    <span class="font-mono text-lg">UNIT SYSTEM</span>
                    <button id="btn-unit-toggle" class="bg-primary/20 text-primary border border-primary px-4 py-2 rounded font-bold hover:bg-primary hover:text-black transition-colors">MPH</button>
                </div>
                <div class="glass-panel p-4 rounded-lg space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="font-mono text-lg text-alert">AUDIBLE WARNING</span>
                        <span id="threshold-value" class="text-xl font-bold font-display text-alert">+5 MPH</span>
                    </div>
                    <input id="threshold-slider" type="range" min="0" max="20" value="5" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                    <p class="text-[10px] text-muted uppercase tracking-widest">Plays sound when exceeding limit</p>
                </div>
            </div>
            <button id="btn-close-settings" class="w-full py-4 bg-primary text-black font-bold font-display tracking-widest hover:bg-white transition-colors rounded">SAVE & RETURN</button>
        </div>
    </div>

    <div id="hud-content" class="absolute inset-0 flex flex-col transition-transform duration-500 bg-black">
        
        <div id="map-bg" class="absolute inset-0 opacity-60"></div>

        <div id="scene-container" class="absolute inset-0 pointer-events-none hud-perspective overflow-hidden z-[5]">
            <div id="grid-plane" class="absolute inset-[-50%] w-[200%] h-[200%] grid-bg animate-grid hud-grid-3d"></div>
        </div>

        <header class="relative z-50 p-6 flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col">
                <div class="flex items-center gap-2 text-primary drop-shadow-md">
                    <div class="w-2 h-2 bg-primary animate-pulse rounded-full"></div>
                    <span class="font-display font-bold tracking-widest text-sm">NAV.SYS.ONLINE</span>
                </div>
                <div class="text-[10px] font-mono mt-1 flex gap-2 bg-black/50 px-2 py-1 rounded w-fit backdrop-blur-sm">
                    <span class="text-muted" id="gps-accuracy-label">ACCURACY: --m</span>
                    <span class="text-green-500 hidden" id="wake-status">| LOCKED</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="btn-mirror-mode" class="p-3 rounded-full border border-white/10 text-muted glass-panel hover:text-primary hover:border-primary transition-all active:scale-95 group">
                    <div class="group-hover:rotate-180 transition-transform duration-500">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 4 4-4 4"/><path d="M20 17H4"/><path d="m8 11-4-4 4-4"/><path d="M4 7h16"/></svg>
                    </div>
                </button>
                <button id="btn-open-settings" class="p-3 rounded-full border border-white/10 text-muted glass-panel hover:text-primary hover:border-primary transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </header>

        <main class="flex-1 flex flex-col items-center justify-center relative z-20 pb-24 pointer-events-none">
            <div class="relative group">
                <div id="speed-circle" class="w-56 h-56 rounded-full bg-black/40 border-8 border-primary/30 flex flex-col items-center justify-center shadow-[0_0_50px_rgba(6,182,212,0.4)] backdrop-blur-md transition-colors duration-300">
                    <div id="limit-ring" class="absolute inset-0 rounded-full border-4 border-transparent transition-all duration-300"></div>
                </div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <h1 id="speed-display" class="text-[9rem] font-black font-mono tracking-tighter leading-none text-primary drop-shadow-[0_0_20px_rgba(6,182,212,0.8)]">0</h1>
                </div>
                <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 px-6 py-2 rounded-full border border-primary bg-black/90 font-display font-bold tracking-[0.3em] text-primary text-sm shadow-lg backdrop-blur-xl">
                    <span id="unit-label">MPH</span>
                </div>
            </div>
            
            <div id="limit-container" class="mt-12 flex flex-col items-center opacity-50 transition-opacity duration-300">
                <div id="limit-box" class="w-16 h-16 rounded border-4 border-white bg-black/80 backdrop-blur flex items-center justify-center transition-colors">
                    <span id="limit-display" class="font-sans font-bold text-3xl text-white">--</span>
                </div>
                <span class="text-[10px] text-muted mt-2 tracking-widest bg-black/50 px-2 rounded">LIMIT</span>
            </div>
        </main>

        <footer class="relative z-50 p-6 grid grid-cols-2 md:grid-cols-4 gap-4 bg-gradient-to-t from-black via-black/90 to-transparent pointer-events-auto">
            <div class="glass-panel p-4 rounded-lg border-l-2 border-primary/50">
                <label class="text-[10px] text-muted uppercase tracking-widest block mb-1">Status</label>
                <span class="text-primary font-mono text-sm md:text-lg flex items-center gap-2">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></span>
                    <span id="status-text">WAITING</span>
                </span>
            </div>
            <div class="glass-panel p-4 rounded-lg border-l-2 border-white/10">
                <label class="text-[10px] text-muted uppercase tracking-widest block mb-1">LATITUDE</label>
                <span id="lat-display" class="text-white font-mono text-sm md:text-lg">--.----</span>
            </div>
            <div class="glass-panel p-4 rounded-lg border-l-2 border-white/10">
                <label class="text-[10px] text-muted uppercase tracking-widest block mb-1">LONGITUDE</label>
                <span id="lon-display" class="text-white font-mono text-sm md:text-lg">--.----</span>
            </div>
            <div class="glass-panel p-4 rounded-lg border-l-2 border-primary/50">
                <label class="text-[10px] text-muted uppercase tracking-widest block mb-1">Current Road</label>
                <span id="road-name" class="font-mono text-xs md:text-sm text-white truncate block">SCANNING...</span>
            </div>
        </footer>
    </div>

    <script>
        // --- MAP SYSTEM (Leaflet) ---
        let map = null;
        let userMarker = null;

        const initMap = () => {
            // Initialize map on 'map-bg', center on 0,0 initially
            map = L.map('map-bg', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,      // User can't move map, it follows GPS
                touchZoom: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                keyboard: false
            }).setView([0, 0], 16);

            // Add Dark Tiles (CartoDB Dark Matter)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(map);

            // Create Custom Arrow Icon
            const arrowIcon = L.divIcon({
                className: 'custom-arrow',
                html: '<div id="driver-arrow" class="arrow-icon"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            userMarker = L.marker([0, 0], {icon: arrowIcon}).addTo(map);
        };

        // Update Marker Rotation based on Heading
        const updateMapMarker = (lat, lon, heading) => {
            if (!map) return;
            map.setView([lat, lon], 17); // Keep map centered
            userMarker.setLatLng([lat, lon]);
            
            // Rotate the arrow inside the marker
            const arrow = document.getElementById('driver-arrow');
            if (arrow && heading !== null && !isNaN(heading)) {
                arrow.style.transform = `rotate(${heading}deg)`;
            }
        };

        // --- WAKE LOCK ---
        let wakeLock = null;
        const wakeStatus = document.getElementById('wake-status');

        const requestWakeLock = async () => {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeStatus.classList.remove('hidden');
                    wakeLock.addEventListener('release', () => wakeStatus.classList.add('hidden'));
                }
            } catch (err) { console.warn(err); }
        };
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock();
        });

        // --- AUDIO ENGINE ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastBeepTime = 0;
        const playWarningTone = () => {
            const now = Date.now();
            if (now - lastBeepTime < 800) return;
            lastBeepTime = now;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sawtooth'; 
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.3);
        };

        // --- STATE & UTILS ---
        const state = {
            speed: 0, unit: 'mph', lat: null, lon: null, heading: 0, limit: null, 
            warningThreshold: 5, lastApiLat: null, lastApiLon: null, isMirrored: false
        };

        const els = {
            body: document.getElementById('app-body'),
            hudContent: document.getElementById('hud-content'),
            speed: document.getElementById('speed-display'),
            limit: document.getElementById('limit-display'),
            limitContainer: document.getElementById('limit-container'),
            limitBox: document.getElementById('limit-box'),
            lat: document.getElementById('lat-display'),
            lon: document.getElementById('lon-display'),
            road: document.getElementById('road-name'),
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            unitBtn: document.getElementById('btn-unit-toggle'),
            unitLabel: document.getElementById('unit-label'),
            mirrorBtn: document.getElementById('btn-mirror-mode'),
            settingsBtn: document.getElementById('btn-open-settings'),
            closeSettingsBtn: document.getElementById('btn-close-settings'),
            settingsModal: document.getElementById('settings-modal'),
            accLabel: document.getElementById('gps-accuracy-label'),
            thresholdSlider: document.getElementById('threshold-slider'),
            thresholdValue: document.getElementById('threshold-value')
        };

        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            if (!lat1 || !lat2) return 99999;
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        };

        // --- CORE LOGIC ---
        const fetchSpeedLimit = async (lat, lon) => {
            const dist = calculateDistance(state.lastApiLat, state.lastApiLon, lat, lon);
            if (dist < 20) return; 
            state.lastApiLat = lat; state.lastApiLon = lon;
            els.road.innerText = "SCANNING...";

            const query = `[out:json][timeout:5];way(around:15,${lat},${lon})["highway"];out tags;`;
            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST', body: "data=" + encodeURIComponent(query)
                });
                const data = await response.json();
                if (data.elements && data.elements.length > 0) {
                    const way = data.elements.find(e => e.tags.maxspeed) || data.elements[0];
                    els.road.innerText = way.tags.name || "Unknown Road";
                    let limitNum = parseInt(way.tags.maxspeed);
                    state.limit = isNaN(limitNum) ? null : limitNum;
                } else {
                    els.road.innerText = "OPEN ROAD";
                    state.limit = null;
                }
            } catch (err) { els.road.innerText = "DATA ERROR"; }
            updateLimitUI();
        };

        const updateLimitUI = () => {
            if (state.limit) {
                els.limit.innerText = state.limit;
                els.limitContainer.classList.remove('opacity-50');
                els.limitContainer.classList.add('opacity-100');
            } else {
                els.limit.innerText = "--";
                els.limitContainer.classList.add('opacity-50');
            }
        };

        const success = (pos) => {
            const crd = pos.coords;
            state.lat = crd.latitude;
            state.lon = crd.longitude;
            state.heading = crd.heading; // Get direction (0-360)

            els.accLabel.innerText = `ACCURACY: ±${Math.round(crd.accuracy)}m`;
            els.lat.innerText = state.lat.toFixed(5);
            els.lon.innerText = state.lon.toFixed(5);

            const multiplier = state.unit === 'mph' ? 2.23694 : 3.6;
            const finalSpeed = Math.round((crd.speed || 0) * multiplier);
            els.speed.innerText = finalSpeed;

            els.statusText.innerText = "TRACKING";
            els.statusDot.classList.replace('bg-red-500', 'bg-primary');
            els.statusDot.classList.add('animate-pulse');

            // Update Map
            updateMapMarker(state.lat, state.lon, state.heading);

            fetchSpeedLimit(state.lat, state.lon);
            checkSpeeding(finalSpeed);
        };

        const checkSpeeding = (currentSpeed) => {
            if (!state.limit) return setNormalState();
            if (currentSpeed > state.limit) {
                els.speed.classList.replace('text-primary', 'text-alert');
                els.limitBox.classList.replace('border-white', 'border-alert');
            } else { setNormalState(); }
            if ((currentSpeed - state.limit) >= state.warningThreshold) {
                els.body.classList.add('alert-mode'); playWarningTone();
            } else { els.body.classList.remove('alert-mode'); }
        };

        const setNormalState = () => {
            els.speed.classList.replace('text-alert', 'text-primary');
            els.limitBox.classList.replace('border-alert', 'border-white');
            els.body.classList.remove('alert-mode');
        };

        const error = (err) => {
            els.statusText.innerText = "NO GPS";
            els.statusDot.classList.replace('bg-primary', 'bg-red-500');
        };

        // --- LISTENERS ---
        els.settingsBtn.addEventListener('click', () => {
            els.settingsModal.style.display = 'flex';
            if (audioCtx.state === 'suspended') audioCtx.resume();
            requestWakeLock();
        });
        els.closeSettingsBtn.addEventListener('click', () => els.settingsModal.style.display = 'none');
        els.thresholdSlider.addEventListener('input', (e) => {
            state.warningThreshold = parseInt(e.target.value);
            els.thresholdValue.innerText = `+${state.warningThreshold} ${state.unit.toUpperCase()}`;
        });
        els.unitBtn.addEventListener('click', () => {
            state.unit = (state.unit === 'mph') ? 'kph' : 'mph';
            els.unitBtn.innerText = state.unit.toUpperCase();
            els.unitLabel.innerText = state.unit.toUpperCase();
        });
        els.mirrorBtn.addEventListener('click', () => {
            els.hudContent.classList.toggle('mirror-mode');
            state.isMirrored = !state.isMirrored;
            requestWakeLock();
        });

        // --- INIT ---
        initMap(); // Start Leaflet
        if ('geolocation' in navigator) {
            els.statusText.innerText = "ACQUIRING...";
            navigator.geolocation.watchPosition(success, error, {
                enableHighAccuracy: true, timeout: 5000, maximumAge: 0
            });
            requestWakeLock();
        }

        // --- PWA SERVICE WORKER REGISTRATION (REQUIRED FOR INSTALL) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW Registered!', reg))
                .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>
</html>
